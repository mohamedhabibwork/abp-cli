name: Bug Report
description: Report a generator, setup, or workflow problem.
title: "fix: "
labels:
  - bug
  - needs-triage
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps To Reproduce
      description: Include the exact command and a small config if possible.
      placeholder: |
        abp-cli generate --root ./MyApp --entity Product --dry-run
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: input
    id: abp-version
    attributes:
      label: ABP Version
      placeholder: "10.1.0"
  - type: input
    id: cli-version
    attributes:
      label: abp-cli Version
      placeholder: "Run: abp-cli version"
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true
