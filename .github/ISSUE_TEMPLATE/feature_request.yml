name: Feature Request
description: Request a new generator feature, file type, or setup behavior.
title: "feat: "
labels:
  - enhancement
  - needs-triage
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: What should the CLI generate or support?
    validations:
      required: true
  - type: textarea
    id: abp-context
    attributes:
      label: ABP Context
      description: Mention ABP version, module shape, mapping style, and target file types if relevant.
      placeholder: "ABP 10, Mapperly, Domain/Application/HttpApi/EF Core"
  - type: textarea
    id: example
    attributes:
      label: Example Command Or Template
      description: Optional command, config JSON, or template idea.
      render: shell
